<!DOCTYPE html>
<!-- index.html = the HOME PAGE. Browsers always open the file called index.html first. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Sampada ko Adara | Give 5 minutes. Save a voice.</title>
</head>
<body>

  <!-- ===== TOP BAR ===== -->
  <header class="topbar">
    <a href="index.html" class="logo">Sampada ko Adara <span class="logo-np">सम्पदाको आधार</span></a>
    <nav class="nav">
      <a href="about.html" class="nav-link">About us</a>
      <!-- auth-area: script.js swaps these two buttons for a user menu once someone is logged in -->
      <div class="auth-area" id="auth-area">
        <button class="btn" data-auth="login">Sign in</button>
        <button class="btn" data-auth="join">Join as volunteer or learner</button>
      </div>
    </nav>
  </header>

  <!-- ===== HERO CAROUSEL =====
       The slides are NOT written here. script.js builds them from the SLIDES list at the top of that file.
       To add, remove or edit a slide, edit that list. -->
  <section class="carousel" aria-label="Facts about language in Nepal">
    <div class="slides"></div>

    <button class="arrow prev" aria-label="Previous slide">&#10094;</button>
    <button class="arrow next" aria-label="Next slide">&#10095;</button>
    <div class="dots"></div>
  </section>

  <!-- ===== EMPTY SPACE FOR LATER =====
       The map, quiz and volunteer sections will go inside this <main>. -->
  <main class="content" id="content">
    <p>More is coming here: the language map, quick lessons and volunteer tasks.</p>
  </main>

  <!-- ===== FOOTER: brand + vision on the left, socials / newsletter / links on the right ===== -->
  <footer class="footer">
    <div class="footer-brand">
      <a href="index.html" class="logo">Sampada ko Adara <span class="logo-np">सम्पदाको आधार</span></a>
      <p>Keeping Nepal's languages alive, five minutes at a time. Learn a phrase, verify a word, save a voice.</p>
    </div>

    <div class="footer-right">
      <!-- Social icons: replace each href="#" with your real page link -->
      <div class="socials">
        <a href="#" aria-label="Facebook" class="social">f</a>
        <a href="#" aria-label="Instagram" class="social"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg></a>
        <a href="#" aria-label="YouTube" class="social"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.200 0-7.800.4A2.500 2.500 0 0 0 2.400 7.200C2 8.800 2 12 2 12s0 3.200.4 4.800a2.500 2.500 0 0 0 1.800 1.800C5.800 19 12 19 12 19s6.200 0 7.800-.4a2.500 2.500 0 0 0 1.800-1.800c.4-1.600.4-4.800.4-4.800s0-3.200-.4-4.800ZM10 15V9l5.200 3L10 15Z"/></svg></a>
        <a href="#" aria-label="LinkedIn" class="social">in</a>
        <a href="mailto:hello@example.com" aria-label="Get in touch by email" class="social">@</a>
      </div>

      <div class="footer-row">
        <!-- Newsletter box (script.js shows a thank-you message; it does not save emails yet) -->
        <form class="newsletter" id="newsletter">
          <label for="email">Subscribe to our newsletter</label>
          <div class="news-field">
            <input type="email" id="email" placeholder="you@example.com" required>
            <button type="submit" class="btn">Subscribe</button>
          </div>
          <p class="news-msg" id="news-msg" aria-live="polite"></p>
        </form>

        <nav class="footer-links">
          <a href="about.html">About us</a>
          <a href="#">FAQs</a>
          <a href="#">Privacy policy</a>
        </nav>
      </div>
    </div>
  </footer>

  <!-- script.js must stay at the bottom so the page exists before the script runs -->
  <script src="script.js"></script>
</body>
</html>
